<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>KALAMIDADE - ULTIMATE CARD GAME</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        :root { 
            --p: #ff3300; --t: #ffcc00; --bg: #050508; 
            --card-w: 100px; --card-h: 140px; 
        }
        body { background: var(--bg); color: white; font-family: 'Orbitron', sans-serif; margin: 0; overflow: hidden; touch-action: none; user-select: none; }
        .screen { display: none; height: 100vh; width: 100vw; flex-direction: column; }
        .active { display: flex !important; }
        
        #hud { background: rgba(0,0,0,0.95); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--p); height: 75px; z-index: 100; }
        #phase-bar { background: #111; display: flex; justify-content: center; gap: 15px; padding: 12px; border-bottom: 1px solid #333; }
        .phase { padding: 8px 18px; border-radius: 5px; opacity: 0.2; border: 1px solid white; font-size: 11px; }
        .phase.active-p { opacity: 1; border-color: var(--t); color: var(--t); box-shadow: 0 0 20px var(--t); }
        
        .btn { padding: 12px 20px; border: 2px solid var(--p); background: transparent; color: white; cursor: pointer; font-family: 'Orbitron'; font-size: 11px; border-radius: 8px; text-transform: uppercase; font-weight: bold; }
        .btn:hover { background: var(--p); box-shadow: 0 0 10px var(--p); }

        #game-container { flex-grow: 1; overflow: hidden; background: #08080a; position: relative; }
        #game-board { transition: transform 0.1s ease-out; transform-origin: center center; width: 100%; height: 100%; }
        .zone { border: 1px solid rgba(255,255,255,0.05); position: relative; display: flex; justify-content: center; align-items: center; gap: 20px; padding: 40px; min-height: 150px; }
        .zone-label { position: absolute; top: 5px; left: 10px; font-size: 10px; color: var(--p); opacity: 0.6; letter-spacing: 2px; }

        #deck-pile { 
            position: fixed; bottom: 30px; left: 30px; width: var(--card-w); height: var(--card-h);
            background-image: url('https://i.postimg.cc/t1Grstkt/unnamed-(1).jpg');
            background-size: cover; border: 3px solid #555; border-radius: 12px; z-index: 200;
            cursor: pointer; box-shadow: -6px 6px 0px #000;
        }

        #discard-pile-zone { 
            position: fixed; bottom: 30px; left: 150px; width: var(--card-w); height: var(--card-h);
            border: 2px solid #ff3300; border-radius: 12px; z-index: 200;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #fff; font-size: 10px; text-align: center; background: rgba(0,0,0,0.5);
            background-size: cover; background-position: center; cursor: pointer;
        }

        .card-container { position: relative; width: var(--card-w); height: var(--card-h); flex-shrink: 0; }
        .card { width: var(--card-w); height: var(--card-h); position: absolute; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .card-inner { width: 100%; height: 100%; border-radius: 10px; overflow: hidden; border: 1px solid #444; background: #111; position: relative; }
        .card-img { width: 100%; height: 100%; background-size: cover; background-position: center; pointer-events: none; }
        .card-cost { position: absolute; top: -8px; right: -8px; background: var(--p); color: white; width: 24px; height: 24px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 12px; border: 2px solid white; z-index: 30; }
        
        .counter-tag { position: absolute; top: 5px; right: 5px; background: #0066ff; color: white; border: 1px solid white; border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; z-index: 40; }
        .power-tag { position: absolute; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.8); color: var(--t); padding: 5px 0; font-size: 12px; font-weight: bold; z-index: 40; text-align: center; border-top: 1px solid var(--t); }

        #context-menu { display: none; position: fixed; background: #0a0a0a; border: 2px solid var(--p); z-index: 9500; flex-direction: column; min-width: 200px; box-shadow: 8px 8px 25px #000; border-radius: 10px; }
        .menu-item { padding: 15px 20px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #222; text-transform: uppercase; color: #eee; font-weight: bold; }
        .menu-item:hover { background: var(--p); color: white; }

        #search-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); z-index: 9000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        #search-grid { display: flex; flex-direction: row; gap: 20px; width: 95%; overflow-x: auto; padding: 40px 20px; margin: 20px 0; border: 1px solid #333; border-radius: 15px; }

        #build-grid { display: grid; grid-template-columns: repeat(auto-fill, 120px); gap: 25px; padding: 30px; overflow-y: auto; flex: 1; height: calc(100vh - 100px); }
        .target-glow { animation: pulse-glow 1s infinite alternate; border: 3px solid #00ffff !important; }
        @keyframes pulse-glow { from { box-shadow: 0 0 5px #00ffff; } to { box-shadow: 0 0 20px #00ffff; } }
        
        .zoom-buff-list { display: flex; gap: 10px; margin-top: 20px; overflow-x: auto; max-width: 80vw; padding-bottom: 10px; }
        .buff-mini-card { width: 80px; height: 110px; border: 2px solid var(--t); border-radius: 5px; background-size: cover; flex-shrink: 0; }
        
        #zoom-content { display: flex; flex-direction: row; align-items: flex-start; justify-content: center; gap: 30px; max-width: 95vw; }
        .zoom-card-box { display: flex; flex-direction: column; align-items: center; width: 320px; }
        .evolve-label { color: #00ff00; font-size: 14px; margin-bottom: 10px; font-weight: bold; letter-spacing: 2px; }
    </style>
</head>
<body>

<div id="context-menu"></div>

<div id="zoom-modal" onclick="this.style.display='none'" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.98); z-index:9999; flex-direction:column; align-items:center; justify-content:center; overflow-y: auto; padding: 20px 0;">
    <div id="zoom-content">
        <div class="zoom-card-box">
            <div id="view-a" style="width:320px; height:450px; border:4px solid var(--p); border-radius:20px; background-size:cover; margin-bottom:15px;"></div>
            <div id="abi-a" style="color:white; font-size:14px; background:rgba(255,51,0,0.15); padding:15px; border:1px solid var(--p); border-radius:10px; width: 100%; box-sizing: border-box; min-height: 80px;"></div>
        </div>
        <div id="zoom-evo-box" class="zoom-card-box" style="display:none;">
            <div class="evolve-label">EVOLUÇÃO DISPONÍVEL</div>
            <div id="view-evo" style="width:320px; height:450px; border:4px solid #00ff00; border-radius:20px; background-size:cover; margin-bottom:15px;"></div>
            <div id="abi-evo" style="color:white; font-size:14px; background:rgba(0,255,0,0.1); padding:15px; border:1px solid #00ff00; border-radius:10px; width: 100%; box-sizing: border-box; min-height: 80px;"></div>
        </div>
    </div>
    <div id="buff-container" style="display:none; margin-top: 25px; text-align: center;">
        <div style="color:var(--t); font-size: 12px; letter-spacing: 2px; margin-bottom: 10px;">CARTAS ANEXADAS</div>
        <div id="zoom-buffs" class="zoom-buff-list"></div>
    </div>
</div>

<div id="search-overlay">
    <h1 id="search-title" style="color:var(--t); letter-spacing:5px;">BUSCA NO DECK</h1>
    <div id="search-grid"></div>
    <button class="btn" onclick="document.getElementById('search-overlay').style.display='none'" style="width:200px; padding:20px;">FECHAR</button>
</div>

<div id="scr-builder" class="screen">
    <div id="hud">
        <button class="btn" onclick="Builder.close()">SAIR</button>
        <span id="d-count" style="font-size:24px; color:var(--t); font-weight:bold;">0/20</span>
        <div>
            <button class="btn" onclick="Builder.clearAll()" style="margin-right:15px;">LIMPAR</button>
            <button class="btn" onclick="Builder.save()" style="border-color:#00ff00; color:#00ff00;">SALVAR</button>
        </div>
    </div>
    <div style="display:flex; flex:1; overflow:hidden;">
        <div id="build-grid"></div>
        <div id="d-list" style="width:350px; background:#0a0a0d; padding:25px; overflow-y:auto; border-left:3px solid #1a1a1f;"></div>
    </div>
</div>

<div id="scr-menu" class="screen active" style="justify-content:center; align-items:center;">
    <h1 style="color:var(--p); font-size:5rem;">KALAMIDADE</h1>
    <div style="background:#111; padding:50px; border:2px solid #333; text-align:center; border-radius:20px; width:400px;">
        <button class="btn" onclick="Builder.open()" style="width:100%; margin-bottom:25px;">DECK BUILDING</button>
        <input type="text" id="room-pass" placeholder="CÓDIGO DA SALA" style="padding:20px; width:85%; margin-bottom:25px; background:#000; color:#fff; border:2px solid #444; text-align:center;"><br>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button class="btn" onclick="Game.initSession(true)" style="background:var(--p);">CRIAR</button>
            <button class="btn" onclick="Game.initSession(false)">ENTRAR</button>
        </div>
    </div>
</div>

<div id="scr-game" class="screen">
    <div id="hud">
        <div style="font-size:16px; font-weight:bold;">OP: <span id="op-hp" style="color:var(--p)">20</span> | VOCÊ: <span id="p-hp" style="color:#00ff00">20</span> | CUSTO: <span id="turn-cost" style="color:var(--t)">1</span></div>
        <div id="turn-display">AGUARDANDO...</div>
        <button class="btn" id="btn-phase" onclick="Game.nextPhase()">PRÓXIMA FASE</button>
    </div>
    <div id="phase-bar">
        <div id="ph-1" class="phase">COMPRA</div>
        <div id="ph-2" class="phase">PREPARAÇÃO</div>
        <div id="ph-3" class="phase">BATALHA</div>
        <div id="ph-4" class="phase">FIM</div>
    </div>
    <div id="game-container">
        <div id="game-board">
            <div id="z-en-hand" class="zone"><div class="zone-label">MÃO ADVERSÁRIA</div></div>
            <div id="z-en-base" class="zone"><div class="zone-label">BASE RIVAL</div></div>
            <div id="z-en-battle" class="zone"><div class="zone-label">CAMPO RIVAL</div></div>
            <hr style="border: 1px solid rgba(255,51,0,0.1); margin:0;">
            <div id="z-my-battle" class="zone"><div class="zone-label">MEU CAMPO</div></div>
            <div id="z-my-base" class="zone"><div class="zone-label">MINHA BASE</div></div>
            <div id="z-my-hand" class="zone" style="min-height:200px;"></div>
        </div>
    </div>
    <div id="deck-pile" onclick="Game.showDeckMenu(event)"></div>
    <div id="discard-pile-zone" onclick="Game.showDiscardPile()">DESCARTES<br><span id="discard-count">0</span></div>
</div>

<script>
const DB = [
    { id: 1, type:'tropa', name:"Cavaleiro", cost:0, atk:2, buff:1, abi:"Sem Habilidade.", img:"https://i.postimg.cc/X7yBc6yr/Add-Text-01-30-12-08-24.png" },
    { id: 2, type:'tropa', name:"Cavaleiro Lanceiro", cost:0, atk:1, buff:2, abi:"Sem Habilidade.", img:"https://i.postimg.cc/HWF9C2wj/Add-Text-01-30-12-09-12.png" },
    { id: 3, type:'tropa', name:"Tyler, Aprendiz de Cavaleiro", cost:1, atk:1, buff:0, abi:"Se tiver 3 ou mais de Ark, Evolua essa carta.", img:"https://i.postimg.cc/rwMW8Yzj/Add-Text-01-30-12-15-09.png", evolutionId: 4 },
    { id: 4, type:'tropa', name:"Tyler, Aprendiz Destemido", cost:2, atk:3, buff:1, abi:"Ganha +3 de Atk se tiver Tropas Anexadas a essa carta.", img:"https://i.postimg.cc/nLMXr8ZF/Add-Text-01-30-12-19-02.png", isEvolution: true },
    { id: 5, type:'tropa', name:"Trevor, Traidor Condenado", cost:2, atk:0, buff:0, abi:"Não pode ser jogad no Campo dr Batalha se tiver 4 ou menos de Atk. Evolua essa carta quando for jogado no Campo de Batalha.", img:"https://i.postimg.cc/mkSLVVRj/Add-Text-01-30-12-22-10.png", evolutionId: 6 },
    { id: 6, type:'tropa', name:"Trevor, Cavaleiro Redimido", cost:3, atk:5, buff:3, abi:"Essa carta ganha +1 de Atk para cada Tropa Anexada em Campo.", img:"https://i.postimg.cc/YqqMM6MN/Add-Text-01-30-12-24-16.png", isEvolution: true },
    { id: 7, type:'tropa', name:"Cedric, Escudeiro da Guarda", cost:2, atk:0, buff:3, abi:"Essa carta fanha +1 de Atk por cada Tropa Anexada a ela.", img:"https://i.postimg.cc/qMRV9pxb/Add-Text-01-30-12-30-48.png" },
    { id: 8, type:'tropa', name:"Balthazar, Comandante dos Cavaleiros", cost:3, atk:3, buff:2, abi:"Essa carta ganha +2 de Atk se tiver cartas Anexadas a ela.", img:"https://i.postimg.cc/2ySMRxhT/Add-Text-01-30-12-34-37.png" },
    { id: 9, type:'tropa', name:"Percival, Cavalero da Guarda", cost:4, atk:3, buff:4, abi:"Essa carta ganh +1 de Atk toda vez que derrota uma Tropa inimiga.", img:"https://i.postimg.cc/0jhfWGfR/Add-Text-01-30-12-36-58.png" },
    { id: 10, type:'tropa', name:"Sarah, Socorrista do Campo", cost:2, atk:0, buff:1, abi:"Adiciona 1 Marcador a uma Tropa.  Ela ganha +1 de Atk se tiver o Marcador.", img:"https://i.postimg.cc/05X4LKLg/Add-Text-01-30-12-41-12.png" },
    { id: 11, type:'tropa', name:"Kalarran, Rei dos Cavaleiros", cost:5, atk:3, buff:3, abi:"Todas as tropas ganham +1 de Atk por cada Tropa em Campo.", img:"https://i.postimg.cc/d3GBfkST/Add-Text-01-30-12-46-45.png" },
    { id: 12, type:'tropa', name:"Cavalo de Guerra", cost:1, atk:0, buff:2, abi:"Jogue uma Tropa de custo zero da sua mão para a Base e Anexe essa carta a ela.", img:"https://i.postimg.cc/yNw0z694/Add-Text-01-30-12-48-52.png" },
    { id: 13, type:'tropa', name:"Lobo Branco das Neves", cost:0, atk:2, buff:1, abi:"Sem Habilidade.", img:"https://i.postimg.cc/HsRqpFnv/Add-Text-01-30-09-45-12.png" },
    { id: 14, type:'tropa', name:"Skorr, Líder da Matilha", cost:1, atk:3, buff:1, abi:"Tropas de custo zero ganham +1/+1.", img:"https://i.postimg.cc/bv8FrPhx/Add-Text-01-30-09-52-39.png" },
    { id: 15, type:'tropa', name:"Hoton, Fúria da Guerra", cost:3, atk:6, buff:0, abi:"Se derrotar uma Tropa, ele pode realizar um segundo Atk.", img:"https://i.postimg.cc/GtMnfMGj/Add-Text-01-31-04-04-54.png" },
    { id: 16, type:'tropa', name:"Rotgar, Retalhador Sanguinário", cost:2, atk:5, buff:0, abi:"Se derrotar uma Tropa inimiga, ganha +1 de Atk.", img:"https://i.postimg.cc/tCJbRh5H/Add-Text-01-30-09-54-35.png" },
    { id: 17, type:'tropa', name:"Uruk, Beserker da Ira", cost:3, atk:5, buff:0, abi:"Essa Tropa ganha +3 de Atk se for a única no Campo de Batalha.", img:"https://i.postimg.cc/Zq5XyPNq/Add-Text-01-30-09-56-49.png" },
    { id: 18, type:'tropa', name:"Valka, Caçadora das Geadas", cost:2, atk:2, buff:2, abi:"Essa carta ganha +1 de Atk por cada Tropa inimiga no Campo de Batalha.", img:"https://i.postimg.cc/sgr48VDX/Add-Text-01-30-09-58-29.png" },
    { id: 19, type:'tropa', name:"Rhotar, Bárbaro Implacável", cost:4, atk:6, buff:3, abi:"Essa carta ganha +1 de Atk por cada Tropa sua na Base.", img:"https://i.postimg.cc/wvDXmyQy/Add-Text-01-31-07-10-25.png" },
    { id: 20, type:'tropa', name:"Gromm, Executor Incansável", cost:4, atk:9, buff:0, abi:"Essa carta perde -3 de Atk para cada Tropa sua na Pilha de Descarte.", img:"https://i.postimg.cc/vBJVVz4B/Add-Text-01-31-06-43-36.png" }
];

function setupLongPress(el, card) {
    let pressTimer;
    const start = (e) => { pressTimer = setTimeout(() => Game.showZoom(card), 600); };
    const cancel = () => { if (pressTimer) clearTimeout(pressTimer); };
    el.onmousedown = start; el.ontouchstart = start;
    el.onmouseup = cancel; el.ontouchend = cancel; el.onmouseleave = cancel;
}

const Builder = {
    selected: [],
    init() { const s = localStorage.getItem('kala_v15_deck'); this.selected = s ? JSON.parse(s) : []; },
    open() { this.init(); document.getElementById('scr-menu').classList.remove('active'); document.getElementById('scr-builder').classList.add('active'); this.render(); this.updateUI(); },
    close() { document.getElementById('scr-builder').classList.remove('active'); document.getElementById('scr-menu').classList.add('active'); },
    clearAll() { if(confirm("Apagar deck?")) { this.selected = []; this.updateUI(); } },
    render() {
        const grid = document.getElementById('build-grid'); grid.innerHTML = "";
        DB.filter(d => !d.isEvolution).forEach(d => {
            const el = document.createElement('div'); el.className = 'card-container';
            el.innerHTML = `<div class=\"card\"><div class=\"card-cost\">${d.cost}</div><div class=\"card-inner\"><div class=\"card-img\" style=\"background-image:url('${d.img}')\"></div></div></div>`;
            setupLongPress(el, d);
            el.onclick = () => this.add(d);
            grid.appendChild(el);
        });
    },
    add(d) {
        if(this.selected.length >= 20) return;
        const count = this.selected.filter(x => x.id === d.id).length;
        const limit = d.cost <= 1 ? 5 : 1;
        if(count < limit) { this.selected.push({...d}); this.updateUI(); }
        else alert(`Limite de ${limit} atingido.`);
    },
    remove(i) { this.selected.splice(i, 1); this.updateUI(); },
    updateUI() {
        document.getElementById('d-count').innerText = `${this.selected.length}/20`;
        const l = document.getElementById('d-list'); l.innerHTML = "<b>COMPOSIÇÃO:</b><br><br>";
        this.selected.forEach((s, i) => { l.innerHTML += `<div style=\"padding:10px; border-bottom:1px solid #222;\">${s.name} <span onclick=\"Builder.remove(${i})\" style=\"color:red; float:right; cursor:pointer;\">[X]</span></div>`; });
    },
    save() { localStorage.setItem('kala_v15_deck', JSON.stringify(this.selected)); alert("DECK SALVO!"); }
};

const Game = {
    peer: null, conn: null, hp: 20, opHp: 20, myTurn: false, phase: 0, turnCounter: 1,
    hand: [], deck: [], boardState: [], discardPile: [], opHandSize: 0, opBoard: [],
    attackerSelected: null, isSelectingTarget: false, isMaster: false,

    initSession(isMaster) {
        const roomId = (document.getElementById('room-pass').value || "SALA").toUpperCase().trim();
        this.isMaster = isMaster;
        
        // Destruição preventiva para liberar socket
        if(this.peer) this.peer.destroy();

        // Configuração para garantir estabilidade do servidor PeerJS
        this.peer = new Peer(isMaster ? "KALA-" + roomId : undefined, {
            debug: 2,
            config: {'iceServers': [{ 'urls': 'stun:stun.l.google.com:19302' }]}
        });

        this.peer.on('open', (id) => {
            if(isMaster) {
                console.log("Servidor ativo:", id);
                alert("SALA '" + roomId + "' CRIADA! Compartilhe o código com seu rival.");
                this.peer.on('connection', c => this.setup(c));
            } else {
                console.log("Tentando conexão...");
                const targetId = "KALA-" + roomId;
                const c = this.peer.connect(targetId, { reliable: true });
                
                // Timeout de conexão para feedback
                const connectionTimeout = setTimeout(() => {
                    if (!this.conn) alert("Sala não encontrada. Certifique-se que o Criador já iniciou o jogo.");
                }, 5000);

                c.on('open', () => {
                    clearTimeout(connectionTimeout);
                    this.setup(c);
                });
            }
        });

        this.peer.on('error', (err) => {
            console.error("Erro Peer:", err.type);
            if(err.type === 'unavailable-id') alert("Esta sala já está em uso ou sendo fechada. Tente outro código.");
            else if(err.type === 'peer-unavailable') alert("Sala não encontrada.");
            else alert("Falha na Rede: " + err.type);
        });
    },

    setup(c) {
        this.conn = c;
        const saved = localStorage.getItem('kala_v15_deck');
        this.deck = (saved ? JSON.parse(saved) : []).sort(() => Math.random() - 0.5);
        
        document.getElementById('scr-menu').classList.remove('active');
        document.getElementById('scr-game').classList.add('active');
        
        this.conn.on('data', d => this.handleData(d));
        this.conn.on('close', () => {
            alert("Rival desconectado.");
            location.reload();
        });

        for(let i=0; i<4; i++) this.drawCard();
        if(this.isMaster) { this.myTurn = true; this.startTurn(); }
        this.sync();
    },

    safeSend(data) { if (this.conn && this.conn.open) this.conn.send(data); },
    drawCard() { if(this.deck.length > 0) this.hand.push({ ...this.deck.shift(), instanceId: Math.random(), counters: 0, buff: [], currentZone: 'hand', extraAtk: 0 }); },

    handleData(d) {
        if(d.type === 'sync') { this.opBoard = d.board; this.opHp = d.hp; this.opHandSize = d.hand; this.updateUI(); }
        if(d.type === 'end_turn') { this.turnCounter++; this.startTurn(); }
        if(d.type === 'damage') { this.hp -= d.val; if(this.hp <= 0) alert("DERROTA!"); this.sync(); }
        if(d.type === 'kill') { this.handleUnitDeath(d.id); }
        if(d.type === 'combat_check') this.resolveDefend(d);
    },

    sync() { this.safeSend({ type:'sync', board: this.boardState, hp: this.hp, hand: this.hand.length }); this.updateUI(); },

    nextPhase() {
        if(!this.myTurn) return;
        this.phase++;
        if(this.phase > 4) { this.myTurn = false; this.phase = 0; this.safeSend({ type:'end_turn' }); }
        this.sync();
    },

    startTurn() { 
        this.myTurn = true; this.phase = 1; this.drawCard(); 
        document.getElementById('turn-cost').innerText = Math.min(this.turnCounter, 5);
        this.sync(); 
    },

    showDeckMenu(e) {
        if(!this.myTurn) return;
        const m = document.getElementById('context-menu');
        m.style.display = 'flex'; m.style.top = e.clientY + 'px'; m.style.left = e.clientX + 'px';
        m.innerHTML = "";
        const opt = (t, f) => { const i = document.createElement('div'); i.className = 'menu-item'; i.innerText = t; i.onclick = f; m.appendChild(i); };
        opt("🎴 COMPRAR", () => { this.drawCard(); this.sync(); m.style.display='none'; });
        opt("🔍 ABRIR DECK", () => { this.openDeckSearch(); m.style.display='none'; });
        e.stopPropagation();
    },

    openDeckSearch() {
        document.getElementById('search-title').innerText = "BUSCA NO DECK";
        const grid = document.getElementById('search-grid'); grid.innerHTML = "";
        this.deck.forEach((c, i) => {
            const wrapper = document.createElement('div'); wrapper.style.textAlign = 'center';
            const el = this.createCardEl(c, true, false, true);
            const btnAdd = document.createElement('button'); btnAdd.className = 'btn'; btnAdd.innerText = "MÃO";
            btnAdd.onclick = () => {
                this.hand.push({...this.deck.splice(i, 1)[0], instanceId: Math.random(), counters:0, buff:[], currentZone:'hand', extraAtk:0});
                this.deck.sort(() => Math.random() - 0.5); document.getElementById('search-overlay').style.display = 'none'; this.sync();
            };
            wrapper.appendChild(el); wrapper.appendChild(btnAdd); grid.appendChild(wrapper);
        });
        document.getElementById('search-overlay').style.display = 'flex';
    },

    showDiscardPile() {
        if(this.discardPile.length === 0) return;
        document.getElementById('search-title').innerText = "PILHA DE DESCARTE";
        const grid = document.getElementById('search-grid'); grid.innerHTML = "";
        this.discardPile.forEach((c) => {
            const wrapper = document.createElement('div'); wrapper.style.textAlign = 'center';
            const el = this.createCardEl(c, true, false, true);
            wrapper.appendChild(el); grid.appendChild(wrapper);
        });
        document.getElementById('search-overlay').style.display = 'flex';
    },

    showZoom(c) {
        const modal = document.getElementById('zoom-modal');
        const evoBox = document.getElementById('zoom-evo-box');
        document.getElementById('view-a').style.backgroundImage = `url('${c.img}')`;
        document.getElementById('abi-a').innerText = "HABILIDADE: " + (c.abi || "Nenhuma");
        const evoData = DB.find(d => d.id === c.evolutionId);
        if(evoData) {
            evoBox.style.display = "flex";
            document.getElementById('view-evo').style.backgroundImage = `url('${evoData.img}')`;
            document.getElementById('abi-evo').innerText = "HABILIDADE EVOLUÍDA: " + evoData.abi;
        } else {
            evoBox.style.display = "none";
        }
        const bContainer = document.getElementById('buff-container');
        const bGrid = document.getElementById('zoom-buffs');
        bGrid.innerHTML = "";
        if(c.buff && c.buff.length > 0) {
            bContainer.style.display = "block";
            c.buff.forEach(b => {
                const div = document.createElement('div');
                div.className = 'buff-mini-card';
                div.style.backgroundImage = `url('${b.img}')`;
                bGrid.appendChild(div);
            });
        } else {
            bContainer.style.display = "none";
        }
        modal.style.display = 'flex';
    },

    calculatePower(c) {
        let p = (c.atk || 0) + (c.extraAtk || 0);
        if(c.buff) c.buff.forEach(b => p += (b.buff || 0));
        return p;
    },

    evolveUnit(baseCard) {
        const evoData = DB.find(d => d.id === baseCard.evolutionId);
        if(!evoData) return;
        const evolvedUnit = {
            ...evoData,
            instanceId: baseCard.instanceId,
            currentZone: baseCard.currentZone,
            counters: baseCard.counters,
            buff: baseCard.buff,
            extraAtk: baseCard.extraAtk
        };
        const idx = this.boardState.findIndex(x => x.instanceId === baseCard.instanceId);
        if(idx !== -1) {
            this.boardState[idx] = evolvedUnit;
            this.sync();
            alert(`${baseCard.name} evoluiu para ${evolvedUnit.name}!`);
        }
    },

    showMenu(e, c) {
        if(!this.myTurn) return;
        const m = document.getElementById('context-menu');
        m.style.display = 'flex'; m.style.top = e.clientY + 'px'; m.style.left = e.clientX + 'px';
        m.innerHTML = "";
        const opt = (t, f) => { const i = document.createElement('div'); i.className = 'menu-item'; i.innerText = t; i.onclick = () => { f(); m.style.display='none'; }; m.appendChild(i); };
        opt("🔍 AMPLIAR", () => this.showZoom(c));
        if(c.currentZone === 'hand') {
            const limit = Math.min(this.turnCounter, 5);
            if(c.cost <= limit) {
                opt("📥 JOGAR NA BASE", () => { 
                    this.hand = this.hand.filter(x => x.instanceId !== c.instanceId); 
                    c.currentZone = 'z-my-base'; this.boardState.push(c); this.sync(); 
                });
            }
            opt("🗑️ DESCARTAR", () => { this.hand = this.hand.filter(x => x.instanceId !== c.instanceId); this.discardPile.push(c); this.sync(); });
        }
        if(c.currentZone === 'z-my-base' || c.currentZone === 'z-my-battle') {
            if(c.currentZone === 'z-my-base' && c.evolutionId) opt("🔼 EVOLUIR", () => this.evolveUnit(c));
            if(c.currentZone === 'z-my-base') opt("⚔️ IR P/ CAMPO", () => { c.currentZone = 'z-my-battle'; this.sync(); });
            opt("🔗 ANEXAR", () => {
                const target = this.boardState.find(x => x.instanceId !== c.instanceId && x.currentZone === 'z-my-base');
                if(target && target.buff.length < 3) { 
                    this.boardState = this.boardState.filter(x => x.instanceId !== c.instanceId); 
                    target.buff.push(c); this.sync(); 
                }
            });
            opt("📈 ATK +1", () => { c.extraAtk++; this.sync(); });
            opt("📉 ATK -1", () => { c.extraAtk--; this.sync(); });
            opt("🔵 MARCADOR +1", () => { c.counters = (c.counters || 0) + 1; this.sync(); });
            opt("🔵 REMOVER MARCADOR", () => { if(c.counters > 0) c.counters--; this.sync(); });
            opt("🗑️ DESCARTAR", () => { this.boardState = this.boardState.filter(x => x.instanceId !== c.instanceId); this.discardPile.push(c); this.sync(); });
        }
        if(c.currentZone === 'z-my-battle' && this.phase === 3) {
            opt("💥 ATACAR TROPA", () => { this.attackerSelected = c; this.isSelectingTarget = true; this.updateUI(); });
            opt("🎯 ATACAR HP", () => { this.safeSend({ type:'damage', val: this.calculatePower(c) }); });
        }
        e.stopPropagation();
    },

    createCardEl(c, mine, isEnemyZone = false, noMenu = false) {
        const cont = document.createElement('div'); cont.className = 'card-container';
        if(!mine && !isEnemyZone) {
            cont.innerHTML = `<div class=\"card\"><div class=\"card-inner\"><div class=\"card-img\" style=\"background-image:url('https://i.postimg.cc/t1Grstkt/unnamed-(1).jpg')\"></div></div></div>`;
            return cont;
        }
        const l = document.createElement('div');
        l.className = 'card' + (this.isSelectingTarget && isEnemyZone ? ' target-glow' : '');
        let buffs = "";
        if(c.buff) c.buff.forEach((b, i) => {
            buffs += `<div class=\"card\" style=\"transform:translate(${i*4}px, ${i*4}px); z-index:${i}; opacity:0.6\"><div class=\"card-inner\"><div class=\"card-img\" style=\"background-image:url('${b.img}')\"></div></div></div>`;
        });
        l.innerHTML = `${buffs}<div class=\"card-inner\" style=\"z-index:15\"><div class=\"card-img\" style=\"background-image:url('${c.img}')\"></div>${c.counters > 0 ? `<div class=\"counter-tag\">${c.counters}</div>` : ''}<div class=\"power-tag\">PWR: ${this.calculatePower(c)}</div></div>`;
        if(!noMenu) {
            setupLongPress(l, c);
            l.onclick = (e) => {
                if(mine) this.showMenu(e, c);
                else if(this.isSelectingTarget && isEnemyZone) this.resolveAttack(this.attackerSelected, c.instanceId);
            };
        }
        cont.appendChild(l);
        return cont;
    },

    resolveAttack(atk, targetId) { this.safeSend({ type: 'combat_check', attackerId: atk.instanceId, pwr: this.calculatePower(atk), targetId }); this.isSelectingTarget = false; this.sync(); },

    handleUnitDeath(id) {
        const index = this.boardState.findIndex(x => x.instanceId === id);
        if(index === -1) return;
        const unit = this.boardState[index];
        if(unit.buff && unit.buff.length > 0) {
            const next = unit.buff.shift(); this.discardPile.push({...unit, buff: []});
            Object.assign(unit, next);
        } else { this.discardPile.push(this.boardState.splice(index, 1)[0]); }
        this.sync();
    },

    resolveDefend(d) {
        const target = this.boardState.find(x => x.instanceId === d.targetId); if(!target) return;
        const myPwr = this.calculatePower(target);
        if(d.pwr > myPwr) this.handleUnitDeath(d.targetId);
        else if(d.pwr < myPwr) this.safeSend({ type: 'kill', id: d.attackerId });
        else { this.handleUnitDeath(d.targetId); this.safeSend({ type: 'kill', id: d.attackerId }); }
        this.sync();
    },

    updateUI() {
        document.getElementById('p-hp').innerText = this.hp;
        document.getElementById('op-hp').innerText = this.opHp;
        const discZone = document.getElementById('discard-pile-zone');
        document.getElementById('discard-count').innerText = this.discardPile.length;
        if(this.discardPile.length > 0) {
            const lastCard = this.discardPile[this.discardPile.length - 1];
            discZone.style.backgroundImage = `url('${lastCard.img}')`;
            discZone.style.borderColor = "#ffcc00";
        } else {
            discZone.style.backgroundImage = "none";
            discZone.style.borderColor = "#ff3300";
        }
        document.getElementById('turn-display').innerText = this.myTurn ? "SEU TURNO" : "TURNO DO RIVAL";
        for(let i=1; i<=4; i++) { const el = document.getElementById(`ph-${i}`); if(el) el.className = `phase ${this.phase === i ? 'active-p' : ''}`; }
        ['z-my-hand', 'z-my-base', 'z-my-battle', 'z-en-hand', 'z-en-base', 'z-en-battle'].forEach(id => {
            const z = document.getElementById(id); if(!z) return;
            const lbl = z.querySelector('.zone-label'); z.innerHTML = ""; if(lbl) z.appendChild(lbl);
        });
        this.hand.forEach(c => document.getElementById('z-my-hand').appendChild(this.createCardEl(c, true)));
        this.boardState.forEach(c => {
            const targetZone = document.getElementById(c.currentZone);
            if(targetZone) targetZone.appendChild(this.createCardEl(c, true));
        });
        for(let i=0; i<this.opHandSize; i++) document.getElementById('z-en-hand').appendChild(this.createCardEl(null, false));
        this.opBoard.forEach(c => {
            const zid = c.currentZone.replace('my', 'en');
            const targetZone = document.getElementById(zid);
            if(targetZone) targetZone.appendChild(this.createCardEl(c, false, true));
        });
    }
};

window.onload = () => { Builder.init(); window.onclick = () => document.getElementById('context-menu').style.display='none'; };
</script>
</body>
</html>
